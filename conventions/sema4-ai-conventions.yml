generated: '2026-07-21'
method: searched
source: https://sema4.ai/docs/v2/api + https://sema4.ai/docs/work-item-api
authentication:
  style: bearer-api-key
  header: Authorization
  format: Bearer <api_key>
  ref: authentication/sema4-ai-authentication.yml
versioning:
  scheme: uri-path
  versions: [v1, v2]
  base: https://<deployment-host>/api/v2
  note: >-
    The API base is served under each deployment's own host; a GET on the base
    (/api/v2) returns the exact OpenAPI spec for the version that deployment runs.
pagination:
  styles:
  - name: PaginatedResponse
    used_by: [agents, conversations, messages, audits]
    params: [limit, offset]
    response_fields: [data, has_more, next]
  - name: offset-based
    used_by: [work-items]
    params: [limit, offset]
    response_fields: [records, total_count, next_offset]
idempotency:
  supported: false
  note: >-
    No documented idempotency-key header. Work Item state changes are guarded by
    status-transition preconditions (412 Precondition Failed) rather than an
    idempotency key.
request_tracing:
  note: not documented
error_envelope:
  format: json
  note: >-
    Errors use standard HTTP status codes; the response body may carry an error
    object. Not RFC 9457 problem+json.
  ref: errors/sema4-ai-problem-types.yml
response_codes:
  success: [200, 201, 204, 202]
  client_error: [400, 401, 403, 404, 412, 422]
  server_error: [500, 503]
streaming:
  supported: true
  note: The REST API can stream agent responses (conversation message streaming).
rate_limiting:
  note: not documented
ref:
  lifecycle: lifecycle/sema4-ai-lifecycle.yml
  authentication: authentication/sema4-ai-authentication.yml
  errors: errors/sema4-ai-problem-types.yml
