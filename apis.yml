aid: sema4-ai
name: Sema4 Ai
description: >-
  Sema4.ai is an enterprise AI agent company building a platform that lets
  organizations design, run, and manage AI agents that combine actions,
  intelligence, and enterprise context to transform knowledge work. Its
  developer surface centers on AI Actions — Python functions exposed to agents
  via the open-source Sema4.ai Action Server, which serves both an
  OpenAPI-compatible REST API and a Model Context Protocol (MCP) server. The
  platform adds a versioned REST API (v2) for driving agents, conversations,
  Work Items, data connections, MCP servers, and audits programmatically, plus
  Enterprise and Snowflake-native Team editions. Founded by the team behind
  Robocorp, Sema4.ai is backed by Mayfield.
